# Publica o site no GitHub Pages a cada envio para o main.
#
# O passo `configure-pages` com `enablement: true` liga o GitHub Pages caso
# ainda não esteja ligado — evita ter de o activar à mão nas definições.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação de cada vez. Não cancelamos a que está a meio: interromper
# um envio deixaria o site publicado pela metade.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # O site é estático e vive na raiz — não há nada para compilar.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: publicacao
        uses: actions/deploy-pages@v4
